services:
  - type: web
    name: email-spam-classifier
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m src.train && python -m src.visualize
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
